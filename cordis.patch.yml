# lanyard — your own network for the dsh web GUI, over TLS.
#
# This layer changes no harness source. It replaces two rows and adds three:
# the command-line provider (which upstream uses to refuse `--host 0.0.0.0`)
# and the HTTP carrier (which becomes a subclass that terminates TLS in front
# of the inherited server and puts upstream's own browser session in front of
# every route a network peer reaches). Every other row — dsh-client-connection
# above all — keeps running unmodified: it still authenticates its own routes,
# and each registers them through ctx.webServer and so passes the gate too.
#
# A patch replaces the targeted row's whole `config`, so each row below
# restates every key it owns.

# The stock command-line provider refuses --host 0.0.0.0 outright. Upstream now
# authenticates every browser itself; what a network bind still lacks is TLS
# and a configuration plane that stays at the machine, which the carrier below
# supplies — so this provider takes the seat and lifts the refusal, and the
# carrier refuses an all-interfaces bind that has no TLS material.
- id: web-startup
  disabled: true

# The stock carrier steps aside; the gated one takes its host and port.
- id: webserver
  disabled: true

- insert:
    # Same seat as the disabled `web-startup` row: it injects cmdlineArgs and
    # provides `webStartup`, so every flag-configured row downstream is
    # unchanged.
    - id: lanyard-startup
      name: '@koalafacts/deepseek-harness-lanyard/startup'

    # TLS material: generated once on the first network boot and reused, so
    # a paired device's accept-once certificate exception survives restarts.
    - id: lanyard-tls
      name: '@koalafacts/deepseek-harness-lanyard/tls'
      inject: [webStartup]
      config:
        enabled: !!js (ctx.webStartup.host ?? '127.0.0.1') !== '127.0.0.1' && ctx.webStartup.tls === undefined
        host: !!js ctx.webStartup.host ?? '127.0.0.1'
        dir: !!js dshHomePath('lanyard-tls')

    # The gated carrier. It provides `webServer`, so every consumer that injects
    # that service reaches this one instead of the disabled row above. `port`
    # stays this machine's plaintext listener, exactly as the stock row binds
    # it; devices on the network reach the TLS front on `networkPort`. The
    # compression keys restate the disabled row's own, which a replacement
    # would otherwise silently drop.
    - id: lanyard-webserver
      name: '@koalafacts/deepseek-harness-lanyard/webserver'
      inject: [webStartup, lanyardTls]
      config:
        host: !!js ctx.webStartup.host ?? '127.0.0.1'
        port: !!js ctx.webStartup.port ?? 3080
        networkPort: !!js ctx.webStartup.networkPort ?? 3443
        tls: !!js ctx.webStartup.tls
        compression: gzip
        compressionLevel: 1
        compressionThresholdBytes: 1024
        tlsCertPath: !!js ctx.lanyardTls.paths?.certPath
        tlsKeyPath: !!js ctx.lanyardTls.paths?.keyPath

    # Optional host sleep inhibitor: `--keep-awake` holds the platform's own
    # facility (caffeinate / systemd-inhibit / SetThreadExecutionState) for the
    # process lifetime so idle sleep cannot cut off running sessions or paired
    # LAN devices.
    - id: lanyard-keep-awake
      name: '@koalafacts/deepseek-harness-lanyard/keep-awake'
      inject: [webStartup, subprocess]
      config:
        enabled: !!js ctx.webStartup.keepAwake === true

    # The pairing line: upstream's launch-token link at the address and port a
    # device actually reaches, plus its QR code. Connection owns the token and
    # depends on webRuntime on older releases; newer releases removed that
    # service and expose one concrete interface through the carrier itself.
    - id: lanyard-pairing
      name: '@koalafacts/deepseek-harness-lanyard/pairing'
      inject: [webServer, connection]
      config:
        printPairingUrl: true

