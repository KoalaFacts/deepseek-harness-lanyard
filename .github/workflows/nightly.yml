name: nightly

# Push CI runs the e2e against `latest` — what a person installing dsh today
# gets. This also runs on pull requests so compatibility fixes prove both
# channels before review. It covers the other failure mode: this plugin composes against
# PUBLISHED @deepseek-ai/dsh packages that move on their own schedule, and it
# replaces two shipped rows, so an upstream release can break it while nothing
# in this repo changes. That is how the shipped --no-open flag went missing.
#
# Nothing is pinned here. A plugin that only works against a frozen version is
# not working. The two legs are upstream's own release channels:
#   latest → what users have now
#   next   → upstream's prerelease line, so a breaking change surfaces here
#            before it reaches anyone

on:
  pull_request:
  schedule:
    # 03:17 UTC — off the hour, where Actions scheduling is least congested.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      cli_version:
        description: 'dsh version or dist-tag to test (blank = the matrix legs)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # Both legs always run: which of them fails is the whole diagnostic.
      fail-fast: false
      matrix:
        channel: [latest, next]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium

      - name: Drive the gate over real TLS
        env:
          DSH_E2E_VERSION: ${{ inputs.cli_version || matrix.channel }}
        run: npm run test:e2e

      - name: Drive the pairing flow in a browser
        env:
          DSH_E2E_VERSION: ${{ inputs.cli_version || matrix.channel }}
        run: xvfb-run -a npm run test:e2e:browser

  contract:
    # The unit suite checks three upstream contracts against whatever the
    # lockfile resolved, which goes stale: the rows this plugin replaces
    # (dsh-web-app), the carrier it subclasses (dsh-host-webserver), and the
    # browser session it defers to (dsh-client-connection) — plus the whole
    # Remote surface the CLI (dsh) reaches, which tests/remote-surface.spec.ts
    # holds to the classification. Here it runs against
    # upstream's current prerelease line — for the library packages that is
    # `next`, since they leave `latest` on an abandoned 0.0.1 build.
    name: row contract (next bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install the current contract packages over the lockfile pins
        # Exits 2, SKIPPED, while upstream's publish wave is incomplete.
        run: node scripts/install-next.ts

      - run: npm run test

  drift:
    # The unit suite runs against the lockfile, which goes stale whenever dsh
    # moves. Dependabot cannot follow it (scripts/sync-dsh.ts says why), so this
    # says when the devDependencies lag the release `dsh@latest` ships.
    name: devDependencies track dsh@latest
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Detect drift without misclassifying registry outages
        id: drift
        shell: bash
        run: |
          set +e
          node scripts/sync-dsh.ts --check
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
      # On actual version drift, produce the exact manifest/lockfile pair in
      # an isolated runner. The user's local environment may lack registry
      # access; this is a reviewable candidate, NOT an automatic update.
      - name: Set up pnpm for dependency-update candidate
        if: steps.drift.outputs.status == '1'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - name: Resolve and validate matching manifest and lockfile
        id: resolution
        if: steps.drift.outputs.status == '1'
        shell: bash
        run: |
          set -euo pipefail
          {
            node scripts/sync-dsh.ts
            # DSH 0.2.2-rc.1 moved its vendored Cordis/Schemastery peers as well.
            # Resolve these in the disposable candidate only: never mutate the
            # checked-in manifest without its matching, strict-peer lockfile.
            node --input-type=module -e '
              import { readFileSync, writeFileSync } from "node:fs";
              import { execFileSync } from "node:child_process";
              const path = "package.json";
              const manifest = JSON.parse(readFileSync(path, "utf8"));
              const release = manifest.devDependencies["@deepseek-ai/dsh"];
              if (release !== "0.2.2-rc.1") {
                throw new Error("No reviewed framework-peer migration for DSH " + release);
              }
              const updates = [
                ["@deepseek-ai/cordis", "4.1.0"],
                ["@deepseek-ai/schemastery", "3.19.0"],
                ["@deepseek-ai/cordis-plugin-group", "1.1.0"],
              ];
              for (const [name, version] of updates) {
                const published = execFileSync("npm", ["view", name + "@" + version, "version"], { encoding: "utf8" }).trim();
                if (published !== version) throw new Error("Unverified framework version: " + name + "@" + version);
              }
              manifest.devDependencies["@deepseek-ai/cordis"] = "^4.1.0";
              manifest.devDependencies["@deepseek-ai/schemastery"] = "^3.19.0";
              const wsPath = "pnpm-workspace.yaml";
              const ws = readFileSync(wsPath, "utf8");
              const groupPin = /(@deepseek-ai\/cordis-plugin-group\x27:\s*)1\.0\.5(?=\s|$)/;
              if (!groupPin.test(ws)) throw new Error("Unexpected group override; inspect before changing");
              writeFileSync(wsPath, ws.replace(groupPin, (_match, prefix) => prefix + "1.1.0"));
              writeFileSync(path, JSON.stringify(manifest, null, 2) + "\n");
              console.log("Candidate-only framework migration: Cordis 4.1.0, Schemastery 3.19.0, group 1.1.0");
            '
            pnpm install --lockfile-only --no-frozen-lockfile --strict-peer-dependencies
            # The solver alone does not prove a clean frozen install or that
            # Lanyard compiles and passes its source/package regression suite
            # against the new DSH graph. Only upload a validated candidate.
            pnpm install --frozen-lockfile --strict-peer-dependencies
            npm run check
          } 2>&1 | tee dsh-dependency-resolution.log
      # Never distribute a changed manifest with an unvalidated/stale lockfile
      # as an installable candidate, even when pnpm failed *after* writing it.
      - name: Upload unpublished dependency-update candidate
        if: steps.drift.outputs.status == '1' && steps.resolution.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-dependency-update-${{ github.sha }}
          path: |
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
          if-no-files-found: error
          retention-days: 3
      # A strict-peer failure is actionable evidence, not a usable package
      # candidate. Retain the resolution log separately without bundling the
      # mismatched manifest and lockfile as though they were installable.
      - name: Write rejected dependency-resolution guidance
        if: always() && steps.drift.outputs.status == '1' && steps.resolution.outcome == 'failure'
        run: |
          {
            echo 'Strict peer dependency resolution failed; no usable update candidate exists.'
            echo 'The manifest may have changed, but the lockfile was NOT validated.'
            echo 'Do not install or publish the unresolved manifest/lockfile pair.'
            echo 'Inspect dsh-dependency-resolution.log for the exact conflicts.'
          } > dsh-dependency-rejected.txt
      - name: Upload rejected dependency-resolution diagnostics
        if: always() && steps.drift.outputs.status == '1' && steps.resolution.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-dependency-rejected-${{ github.sha }}
          path: |
            dsh-dependency-rejected.txt
            dsh-dependency-resolution.log
          if-no-files-found: error
          retention-days: 3
      # A generated candidate is not a fix: the repository remains stale until
      # it has been reviewed, installed, tested and committed to this PR.
      - name: Preserve the original drift or registry-check status
        if: always()
        env:
          LANYARD_SYNC_STATUS: ${{ steps.drift.outputs.status }}
        run: |
          if [ -z "$LANYARD_SYNC_STATUS" ]; then exit 1; fi
          exit "$LANYARD_SYNC_STATUS"

  report:
    # A scheduled run that fails silently is decorative. Only for the schedule:
    # a manual run has someone watching it.
    name: report
    needs: [e2e, contract, drift]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'Nightly e2e failed against the newest published dsh'
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              `The nightly run failed: ${run}`,
              '',
              'Read which leg failed before assuming a regression here:',
              '- **`next` fails, `latest` passes** — an upstream prerelease changed something',
              '  this plugin depends on, and it has not reached users yet. This plugin replaces',
              '  the `web-startup` and `webserver` rows, so a renamed row id is skipped with',
              '  only a warning, and a new `webStartup` field falls back to a schema default.',
              '  Both fail quietly, which is what the row-contract test is for.',
              '- **`latest` fails too** — it has reached users. Treat as urgent.',
              '- **only `devDependencies track dsh@latest` fails** — dsh released; nothing broke yet.',
              '  (Exit 2 with SKIPPED there means the registry was unreachable; nothing was compared.)',
              '  Run `node scripts/sync-dsh.ts && pnpm install`, then `npm run check`, and open a PR.',
              '- **a job exited 2 with SKIPPED** — the registry could not serve a complete',
              '  `dsh` graph at that moment. Nothing was tested; no action needed.',
            ].join('\n')
            // One tracking issue, commented on rather than reopened nightly.
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', per_page: 100,
            })
            const existing = open.data.find(issue => issue.title === title)
            if (existing === undefined) {
              await github.rest.issues.create({ ...context.repo, title, body })
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.number, body,
              })
            }

