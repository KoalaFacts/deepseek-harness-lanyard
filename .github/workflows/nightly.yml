name: nightly

# Push CI already runs the e2e against a pinned dsh release. This exists for
# the other failure mode: this plugin composes against PUBLISHED
# @deepseek-ai/dsh packages that move on their own schedule, and it replaces
# two shipped rows — so an upstream release can break it while nothing in this
# repo changes. That is not hypothetical; it is how the shipped --no-open flag
# went missing once already.
#
# So the nightly tracks the newest published release, and runs the pinned one
# beside it to keep a failure interpretable:
#   newest fails, pinned passes  → upstream drift, this plugin needs updating
#   both fail                    → our regression, or infrastructure

on:
  schedule:
    # 03:17 UTC — off the hour, where Actions scheduling is least congested.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      cli_version:
        description: 'dsh version to test (blank = newest published)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.channel }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # Both legs always run: which of them fails is the whole diagnostic.
      fail-fast: false
      matrix:
        channel: [pinned, newest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium

      # An empty DSH_E2E_VERSION means "the pinned default" — the harness
      # treats unset and empty alike, because this is what CI writes.
      - name: Drive the gate over real TLS
        env:
          DSH_E2E_VERSION: ${{ inputs.cli_version || (matrix.channel == 'newest' && 'newest' || '') }}
        run: npm run test:e2e

      - name: Drive the pairing flow in a browser
        env:
          DSH_E2E_VERSION: ${{ inputs.cli_version || (matrix.channel == 'newest' && 'newest' || '') }}
        run: npm run test:e2e:browser

  contract:
    # The unit suite checks the webStartup contract against whatever the
    # lockfile resolved, which is not what a user installs. Here it runs
    # against the newest published bundle, which is.
    name: row contract (newest bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install the newest published web-app bundle over the pin
        run: |
          newest=$(npm view @deepseek-ai/dsh-web-app versions --json | node -e \
            'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const v=JSON.parse(s);console.log(Array.isArray(v)?v.at(-1):v)})')
          echo "testing against @deepseek-ai/dsh-web-app@$newest"
          pnpm add -D "@deepseek-ai/dsh-web-app@$newest"

      - run: npm run test

  report:
    # A scheduled run that fails silently is decorative. Only for the schedule:
    # a manual run has someone watching it.
    name: report
    needs: [e2e, contract]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = 'Nightly e2e failed against the newest published dsh'
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = [
              `The nightly run failed: ${run}`,
              '',
              'Read which leg failed before assuming a regression here:',
              '- **newest fails, pinned passes** — an upstream release changed something this',
              '  plugin depends on. It replaces the `web-startup` and `webserver` rows, so a',
              '  renamed row id is skipped with only a warning, and a new `webStartup` field',
              '  falls back to a schema default. Both fail quietly.',
              '- **both fail** — a regression in this repo, or infrastructure.',
            ].join('\n')
            // One tracking issue, commented on rather than reopened nightly.
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', per_page: 100,
            })
            const existing = open.data.find(issue => issue.title === title)
            if (existing === undefined) {
              await github.rest.issues.create({ ...context.repo, title, body })
            } else {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.number, body,
              })
            }
