name: release
run-name: release v${{ inputs.version }}${{ inputs.dry_run && ' (dry run)' || '' }}

# Cuts a release: gates the tree, then creates the git tag and the GitHub
# Release for a version you name.
#
# This does NOT publish to npm — `publish-npm.yml` does, from the tag this
# creates. The two are separate because npm allows a package exactly one
# trusted publisher configuration, so only one workflow file here can hold the
# OIDC credential; keeping it in the one that does nothing else is what stops
# the gate's unpinned dependencies from running beside it.
#
# Releasing is deliberate rather than automatic: pushing a tag does not start
# this, and this does not publish anything. You name the version, it is checked
# against package.json, and the tag appears only after the whole gate passes.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.2.3 or 1.2.3-rc.1 — must match package.json'
        required: true
        type: string
      dry_run:
        description: 'Run the full gate but stop short of tagging'
        required: false
        default: true
        type: boolean

# Two releases racing would interleave their tagging.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # ci.yml allows 15 minutes for e2e and 20 for browser as separate jobs.
    # These run serially here, plus check and a cold Chromium download, so the
    # budget has to exceed the sum rather than sit under it: a release killed
    # part-way is worse than a slow one.
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags are not fetched by default, and the release guard below asks
          # git whether v$VERSION already exists. Without the full fetch that
          # question always answers "no" and the guard silently protects
          # nothing.
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # A real release may only come from the default branch. `workflow_dispatch`
      # offers every branch in its dropdown, and none of the guards below looks
      # at the ref, so without this anyone with write access could tag an
      # unreviewed branch as a release — and publish-npm.yml publishes what the
      # tag points at. Dry runs are exempt: they create nothing, and rehearsing
      # a branch is the point of them.
      - name: Refuse a real release from anywhere but the default branch
        if: inputs.dry_run == false
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::a real release must run on main; this run is on ${REF}. Re-run it on main, or leave dry_run ticked."
            exit 1
          fi
          echo "releasing from $REF"

      - run: pnpm install --frozen-lockfile

      # Every value below reaches the shell through `env:` rather than `${{ }}`
      # interpolation, which pastes into the script text before bash parses it.
      - name: Resolve the version and its release channel
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # The version is typed rather than inferred. package.json still decides
          # what npm actually publishes, so this is a confirmation rather than a
          # source: it makes the release an explicit act, and it catches the
          # release that was started without bumping the version first — which
          # otherwise republishes whatever happens to be in the tree.
          if ! printf '%s' "$REQUESTED" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::version ${REQUESTED} is not a semver release, e.g. 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi

          VERSION="$(npm pkg get version | tr -d '"')"
          if [ "$REQUESTED" != "$VERSION" ]; then
            echo "::error::you asked to release ${REQUESTED} but package.json says ${VERSION}. npm publishes what package.json says, so bump it and merge before releasing — or re-run naming ${VERSION}."
            exit 1
          fi

          # Upstream ships its prerelease line on `next`, and this plugin's own
          # nightly tests against it. A prerelease landing on `latest` would
          # hand every new installer an rc, so the channel follows the version.
          case "$VERSION" in
            *-*) DIST_TAG=next ;;
            *)   DIST_TAG=latest ;;
          esac

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "releasing $VERSION, for publishing to the $DIST_TAG channel"

      # Both checks run before the long legs rather than after, so a version
      # that cannot be released fails in seconds with a message naming the
      # cause instead of at the last step.
      - name: Refuse a version that is already released
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          NAME="$(npm pkg get name | tr -d '"')"

          # `npm view` exits non-zero for a version that does not exist AND for
          # a network failure, a 5xx, or an auth problem. Swallowing the reason
          # would make an outage read as "free to publish", so the error is
          # captured and only a genuine 404 is accepted as an answer.
          set +e
          VIEW_OUT="$(npm view "$NAME@$VERSION" version 2>&1)"
          VIEW_RC=$?
          set -e
          if [ "$VIEW_RC" -eq 0 ]; then
            echo "::error::$NAME@$VERSION is already on the registry, so tagging it now would claim a release that was published from somewhere else; bump the version in package.json"
            exit 1
          fi
          if ! printf '%s' "$VIEW_OUT" | grep -q 'E404'; then
            echo "::error::could not determine whether $NAME@$VERSION is published, so refusing to guess. npm said:"
            printf '%s\n' "$VIEW_OUT"
            exit 1
          fi

          # A tag for this version with nothing published behind it means an
          # earlier release got part-way. That needs a person, not a retry.
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists. If it was cut by an earlier run of this workflow, the release is done and what remains is to publish it: run publish-npm for $VERSION. Do not delete the tag — publish-npm reads it, and the GitHub Release survives a deleted tag, so the version could not be re-cut afterwards."
            exit 1
          fi

          # And the Release itself, which the tag check does not cover: a
          # release can outlive a deleted tag, and where immutable releases are
          # enabled neither it nor its tag can be replaced afterwards. Finding
          # that out at `gh release create` would mean discovering it AFTER the
          # publish, which is the one state this workflow cannot undo. Same
          # fail-closed shape as the registry check above: `gh` exits non-zero
          # for a missing release and for auth or network trouble alike, so only
          # a genuine not-found is accepted as an answer.
          set +e
          RELEASE_OUT="$(gh release view "v$VERSION" 2>&1)"
          RELEASE_RC=$?
          set -e
          if [ "$RELEASE_RC" -eq 0 ]; then
            echo "::error::a GitHub Release for v$VERSION already exists. Releases are immutable once published where that is enabled, so this one cannot be replaced — release a new version instead."
            exit 1
          fi
          if ! printf '%s' "$RELEASE_OUT" | grep -qi 'release not found'; then
            echo "::error::could not determine whether a Release for v$VERSION exists, so refusing to guess. gh said:"
            printf '%s\n' "$RELEASE_OUT"
            exit 1
          fi

          echo "$NAME@$VERSION is not yet published, and neither tag nor Release v$VERSION exists"

      # Both e2e suites exit 2 with a loud SKIPPED message where they cannot run
      # — no LAN interface, no Playwright — which fails the step here exactly as
      # it does in ci.yml. That is deliberate: a release nobody verified is worse
      # than a release that did not happen, so a run failing with SKIPPED is a
      # runner problem rather than a code problem.
      - run: npm run check
      - run: npm run test:e2e
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:browser


  tag:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Creating the tag and the GitHub Release.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # gh creates the tag from --target, so this is both at once, and the gh
      # CLI ships on the runner so it needs no third-party action. Nothing has
      # been published at this point, so there is no half-done state to explain:
      # a failure here leaves the registry untouched and the tag simply absent.
      - name: Tag the commit and create the GitHub Release
        if: inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          DIST_TAG: ${{ needs.verify.outputs.dist_tag }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          PRERELEASE=()
          if [ "$DIST_TAG" = next ]; then PRERELEASE=(--prerelease); fi
          gh release create "v$VERSION" \
            --target "$TARGET" \
            --title "v$VERSION" \
            --generate-notes \
            "${PRERELEASE[@]}"
          echo "tagged v$VERSION — publish it with the publish-npm workflow"

      - name: Report what a dry run would have done
        if: inputs.dry_run != false
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          DIST_TAG: ${{ needs.verify.outputs.dist_tag }}
        run: |
          echo "dry run only — no tag and no Release were created."
          echo "a real run would tag v$VERSION and cut a Release, for publishing to the $DIST_TAG channel."
