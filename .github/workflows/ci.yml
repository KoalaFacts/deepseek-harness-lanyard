name: ci

on:
  # A branch with an open pull request would otherwise run everything twice —
  # two chromium installs and two full dsh boots per push. Pull requests carry
  # branch coverage; push covers the default branch after a merge.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job here only reads the tree and runs the suites — nothing pushes,
# comments, or uploads. Without this block the jobs inherit the repository
# default, which on an older repository is write-all, and this is the workflow
# that runs on `pull_request` for every branch including automated dependency
# bumps. Narrow it to what the jobs actually use.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # typecheck, then the suite, then the build gate that loads the artifact.
      - run: npm run check
      # Verify changed TLS guards actually make their focused Vitest cases fail when removed.
      - run: npm run test:mutation:tls
      # A main-branch CI tarball lets someone test a real install before npm
      # publication. Only the already-built, 32-file-gated payload is packed;
      # never run lifecycle scripts or upload installable PR artifacts.
      - name: Pack unpublished main build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lanyard-tarball"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/lanyard-tarball"
          tarballs=("$RUNNER_TEMP"/lanyard-tarball/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ] || [ ! -f "${tarballs[0]}" ]; then
            echo "::error::expected exactly one installable tarball"
            exit 1
          fi
          (
            cd "$RUNNER_TEMP/lanyard-tarball"
            sha256sum -- "$(basename "${tarballs[0]}")" > SHA256SUMS
            printf '%s\n' "$GITHUB_SHA" > SOURCE_SHA
          )
      - name: Upload unpublished main install candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unpublished-lanyard-${{ github.sha }}
          path: ${{ runner.temp }}/lanyard-tarball/
          if-no-files-found: error
          retention-days: 7

  e2e:
    # Installs the published dsh CLI and boots it with this plugin installed,
    # then drives the gate from the runner's own LAN address over real TLS.
    # Slower than `check` and needs the network, so it is its own job.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm run test:e2e

  browser:
    # The pairing flow as a person performs it: open the link once in a real
    # browser, then use the bare address. Everything else proves the bootstrap
    # as source; only a browser proves the cookie is attached to a real fetch.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:browser
