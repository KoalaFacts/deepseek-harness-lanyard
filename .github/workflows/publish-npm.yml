name: publish-npm
run-name: publish v${{ inputs.version }} to npm${{ inputs.dry_run && ' (dry run)' || '' }}

# Publishes one already-tagged version to npm, authenticating with npm trusted
# publishing (OIDC). No npm token is stored in this repository: the workflow
# exchanges a short-lived GitHub OIDC token for registry credentials, so there
# is nothing to leak or rotate.
#
# This is the only workflow here that publishes, and that is a constraint rather
# than a preference: npm allows a package exactly one trusted publisher
# configuration, so exactly one file can hold the credential. `release.yml`
# gates the tree and cuts the tag; this publishes what that tag points at.
#
# It publishes the VERIFIED TAG COMMIT, never the mutable tag name or a branch.
# `verify` resolves the tag once and builds/tests that commit; `publish` checks
# out the immutable SHA and refuses a release tag changed after verification.
# This prevents the metadata in the publish job differing from its `lib` artifact.
#
# Setting this up is not only this file — npmjs.com has to be told to trust it.
# See "Releasing" in AGENTS.md. The trusted publisher names a workflow BY
# FILENAME, so it must name `publish-npm.yml`; renaming this file breaks
# publishing until the npm side is changed to match, and that failure surfaces
# as an authentication error saying nothing about the rename.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 1.2.3 — must already be tagged'
        required: true
        type: string
      dry_run:
        description: 'Run the full gate but stop short of publishing'
        required: false
        default: true
        type: boolean

# Two publishes racing would interleave.
concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # The legs run serially here where ci.yml runs them as parallel jobs, so the
    # budget has to exceed the sum of what CI allows rather than sit under it.
    timeout-minutes: 45
    outputs:
      dist_tag: ${{ steps.resolve.outputs.dist_tag }}
      tag_sha: ${{ steps.pin.outputs.tag_sha }}
    steps:
      # Before the checkout, because the version reaches `ref:` below and a
      # value should be shaped like a version before it is used as one.
      - name: Check the request
        env:
          REQUESTED: ${{ inputs.version }}
          REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$REQUESTED" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::version ${REQUESTED} is not a semver release, e.g. 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi

          # A real publish may only be started from the default branch. The tree
          # published comes from the tag either way, but the workflow FILE comes
          # from whatever ref was dispatched, so without this a branch could
          # carry an edited version of this file and publish through the
          # credential. npm's trusted publisher matches owner/repo/workflow and
          # never the ref, so this is the only place it can be enforced.
          if [ "$DRY_RUN" != true ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error::a real publish must be started on main; this run is on ${REF}. Re-run it on main, or leave dry_run ticked."
            exit 1
          fi
          echo "publishing v${REQUESTED} from its tag"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag, not the branch. This is the whole point of the workflow.
          ref: refs/tags/v${{ inputs.version }}
          # Enough history to prove the tag descends from the default branch,
          # below. A shallow checkout of the tag alone cannot answer that.
          fetch-depth: 0

      # Restores a property the split removed rather than adding a new one.
      # Publishing used to mean publishing `github.sha` on main, which the
      # branch guard constrained. Now the tree comes from a tag, and a tag is
      # pushable and force-updatable by anyone with write access — so `v1.2.3`
      # can be made to point at a commit that was never on main, or moved after
      # release.yml gated it. Requiring the tag to be an ancestor of the default
      # branch puts it back on the reviewed line of history.
      - name: Refuse a tag that is not on the default branch
        id: pin
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          TAG_SHA="$(git rev-parse "refs/tags/v$VERSION^{commit}")"
          if ! git merge-base --is-ancestor "$TAG_SHA" refs/remotes/origin/main; then
            echo "::error::tag v$VERSION points at $TAG_SHA, which is not on main. Publishing it would ship a commit that never landed on the default branch."
            exit 1
          fi
          echo "v$VERSION is $TAG_SHA, which is on main"
          echo "tag_sha=$TAG_SHA" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check the tag really holds the version asked for
        id: resolve
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # The checkout succeeded, so the tag exists; this catches the other
          # half — a tag whose package.json says something else, which would
          # publish a version nobody asked for under a tag that disagrees.
          VERSION="$(npm pkg get version | tr -d '"')"
          if [ "$REQUESTED" != "$VERSION" ]; then
            echo "::error::tag v${REQUESTED} holds package.json version ${VERSION}; the tag and the package disagree, which needs a person."
            exit 1
          fi

          case "$VERSION" in
            *-*) DIST_TAG=next ;;
            *)   DIST_TAG=latest ;;
          esac
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "publishing $VERSION to the $DIST_TAG channel"

      - name: Refuse a version already on the registry
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          NAME="$(npm pkg get name | tr -d '"')"

          # `npm view` exits non-zero for a version that does not exist AND for
          # a network failure, a 5xx, or an auth problem. Swallowing the reason
          # would make an outage read as "free to publish", so only a genuine
          # 404 is accepted as an answer.
          set +e
          VIEW_OUT="$(npm view "$NAME@$VERSION" version 2>&1)"
          VIEW_RC=$?
          set -e
          if [ "$VIEW_RC" -eq 0 ]; then
            echo "::error::$NAME@$VERSION is already on the registry; npm versions are immutable, so publish a new version instead"
            exit 1
          fi
          if ! printf '%s' "$VIEW_OUT" | grep -q 'E404'; then
            echo "::error::could not determine whether $NAME@$VERSION is published, so refusing to guess. npm said:"
            printf '%s\n' "$VIEW_OUT"
            exit 1
          fi
          echo "$NAME@$VERSION is not yet published"

      # Both e2e suites exit 2 with a loud SKIPPED message where they cannot run.
      # That fails the step, deliberately: nothing pins `dsh`, so a tag that
      # passed when it was cut can fail against today's upstream, and a release
      # nobody verified is worse than a release that did not happen.
      - run: npm run check
      - run: npm run test:e2e
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a npm run test:e2e:browser

      # `publish` installs nothing, so the build it uploads is the one this gate
      # approved rather than a second build of the same source.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lib
          path: lib
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The credential lives behind `production`, which is the only mechanism that
    # genuinely binds which ref may reach it: a workflow cannot police its own
    # ref, because the guard would be in the file that ref supplies.
    #
    # npm's trusted publisher must name this environment too — `--env production`
    # — and the two sides must agree exactly or the publish fails on
    # authentication. Referencing an environment that does not exist creates it
    # with no protection rules, so this line buys nothing until `production`
    # carries a deployment branch rule. See "Releasing" in AGENTS.md.
    environment: production
    permissions:
      # A job-level block REPLACES the workflow-level one rather than extending
      # it, so every scope not named here is `none` — including the `contents:
      # read` the checkout below needs. The job this was split out of carried
      # `contents: write` for tagging and satisfied the checkout by accident;
      # splitting it dropped that without replacing it.
      contents: read
      # The OIDC token trusted publishing exchanges for registry credentials.
      id-token: write
    steps:
      # Separate job on purpose, and the split is a security boundary rather
      # than a tidiness one. Verifying means executing a great deal of code this
      # repository does not control — `dsh@latest` is deliberately unpinned, plus
      # a Chromium download and the built artifact — while publishing holds a
      # credential that can push a package under this name. Anything running
      # beside that credential can read ACTIONS_ID_TOKEN_REQUEST_URL and mint it,
      # so this job installs nothing and runs no lifecycle scripts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This exact commit produced the verified lib artifact. Do not resolve
          # refs/tags/v<version> a second time in the credential-holding job.
          ref: ${{ needs.verify.outputs.tag_sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Trusted publishing needs Node >= 22.14; the 22 line satisfies it.
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm 11.5.1 first supported OIDC trusted publishing; 11.21.0 added
      # trusted-publisher dist-tag support, required for prerelease --tag next.
      # This job can mint an OIDC token, so do not resolve a floating npm range
      # or silently run a new npm CLI release alongside that credential.
      - name: Install a reviewed npm CLI for trusted publishing
        run: |
          set -euo pipefail
          npm install -g --ignore-scripts npm@11.21.1
          test "$(npm --version)" = "11.21.1"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lib
          path: lib

      # A moved tag must not silently repoint the published version, even though
      # checkout is pinned above. Fetch only to FETCH_HEAD, supporting both
      # lightweight and annotated tags without overwriting a local tag.
      - name: Refuse a release tag changed after verification
        env:
          VERSION: ${{ inputs.version }}
          VERIFIED_SHA: ${{ needs.verify.outputs.tag_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/v$VERSION"
          CURRENT_SHA="$(git rev-parse "FETCH_HEAD^{commit}")"
          if [ "$CURRENT_SHA" != "$VERIFIED_SHA" ]; then
            echo "::error::tag v$VERSION moved after verification (verified $VERIFIED_SHA, current $CURRENT_SHA); refusing publish"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$VERIFIED_SHA" ]; then
            echo "::error::publish checkout is not the verified commit $VERIFIED_SHA"
            exit 1
          fi

      # `--ignore-scripts` keeps `prepare` from running: `lib/` is already built,
      # above, which is the only thing it would have produced. A future prepack
      # step would need building into `verify` rather than added here.
      - name: Publish to npm
        if: inputs.dry_run == false
        env:
          DIST_TAG: ${{ needs.verify.outputs.dist_tag }}
        run: npm publish --provenance --tag "$DIST_TAG" --ignore-scripts

      - name: Report what a dry run would have done
        if: inputs.dry_run != false
        env:
          DIST_TAG: ${{ needs.verify.outputs.dist_tag }}
        run: |
          set -euo pipefail
          npm publish --provenance --tag "$DIST_TAG" --ignore-scripts --dry-run
          echo "dry run only — nothing was published"
