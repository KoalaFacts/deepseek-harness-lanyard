# Pinned action SHAs do not rot on their own. Every `uses:` in this repository
# names a commit rather than a mutable tag, which is what stops a compromised
# action author from repointing `@v4` under a workflow that holds publish
# credentials — but a pin with nothing bumping it is just an old version. This
# is the other half of that convention.

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # One PR for the lot. Each of these runs ci.yml's three jobs — a Chromium
    # download and two full dsh boots — and ci.yml's own trigger set exists to
    # avoid paying that twice per push, which a PR per action would undo.
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "dependencies"

  # The plugin's own dependencies: commander, qrcode-terminal, selfsigned, and
  # the toolchain.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns:
          - "*"
    # `dsh` is deliberately unpinned and tracked by the nightly against
    # upstream's own release channels instead, so bumping it here would replace
    # a floating range that is meant to float. Two of these are load-bearing:
    # dsh-web-app and dsh-client-connection are exact-pinned because
    # tests/webstartup-contract.spec.ts and tests/upstream-session.spec.ts read
    # the INSTALLED copies, so a bump silently changes what those tests prove;
    # and the peerDependencies ranges are the supported window itself, which
    # dsh enforces from 0.1.7, so a bump would change which dsh admits this.
    ignore:
      - dependency-name: "@deepseek-ai/*"
    labels:
      - "dependencies"
